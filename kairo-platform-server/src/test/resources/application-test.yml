spring:
  datasource:
    url: jdbc:h2:mem:kairo_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

kairo:
  platform:
    auth:
      mode: header-dev
    rollout:
      scheduler:
        enabled: false
    script:
      command-timeout-ms: 5000
      expiry:
        initial-delay-ms: 999999
        fixed-delay-ms: 999999
