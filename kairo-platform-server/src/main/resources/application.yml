server:
  port: 18280

spring:
  application:
    name: kairo-platform-server
  datasource:
    url: ${KAIRO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kairo}
    username: ${KAIRO_DB_USER:kairo}
    password: ${KAIRO_DB_PASSWORD:kairo}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${KAIRO_REDIS_HOST:127.0.0.1}
      port: ${KAIRO_REDIS_PORT:6379}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Operators must see which component is DOWN; every contributor sanitises its own details so no
      # credentials, JDBC URLs, tokens or stack traces are exposed (&sect;11.1).
      show-details: always
      group:
        # &sect;11.1: liveness is exclusively process-liveness. DB, Flyway, required Redis and Agent offline
        # state can never drive liveness DOWN because none of them are members of this group.
        liveness:
          include: livenessState
        # &sect;11.1: readiness requires the readiness state, DB connectivity, a real runtime Flyway
        # validate, and Redis only when fencing configures it as required (KairoRedisHealthIndicator gates
        # itself on kairo.platform.fencing.redis-enabled and is a no-op UP/disabled otherwise).
        readiness:
          include: readinessState,db,flyway,redis
  info:
    # Spring's auto info contributors are disabled; KairoBuildInfoContributor emits a single bounded,
    # secret-free build-identity object (version, commit, time, javaTarget, contractBaseline).
    build:
      enabled: false
    git:
      enabled: false
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
  health:
    redis:
      enabled: false
    # Spring Boot 3.3 ships no auto-validating Flyway health indicator; management.health.flyway.enabled
    # is a defensive no-op today that keeps any future auto contributor from shadowing the validating
    # KairoFlywayHealthIndicator (registered as the "flyway" contributor via the HealthIndicator suffix).
    flyway:
      enabled: false

kairo:
  platform:
    api:
      enabled: ${KAIRO_API_ENABLED:true}
    fencing:
      redis-enabled: ${KAIRO_FENCING_REDIS_ENABLED:false}
      key-prefix: ${KAIRO_FENCING_KEY_PREFIX:kairo:fencing:}
      default-ttl-seconds: ${KAIRO_FENCING_DEFAULT_TTL_SECONDS:300}
    rollout:
      scheduler:
        enabled: ${KAIRO_ROLLOUT_SCHEDULER_ENABLED:true}
        fixed-delay-ms: ${KAIRO_ROLLOUT_SCHEDULER_FIXED_DELAY_MS:3000}
        command-lease-seconds: ${KAIRO_AGENT_COMMAND_LEASE_SECONDS:60}
    attach:
      agent-jar: ${KAIRO_ATTACH_AGENT_JAR:/app/kairo-agent-bootstrap.jar}
      core-jar: ${KAIRO_ATTACH_CORE_JAR:/app/kairo-agent-core-modern.jar}
      bootstrap-jar: ${KAIRO_ATTACH_BOOTSTRAP_JAR:/app/kairo-bootstrap-api.jar}
      agent-host: ${KAIRO_ATTACH_AGENT_HOST:127.0.0.1}
      agent-port: ${KAIRO_ATTACH_AGENT_PORT:0}
      platform-url: ${KAIRO_ATTACH_PLATFORM_URL:http://127.0.0.1:18280}
      platform-token: ${KAIRO_ATTACH_PLATFORM_TOKEN:}
      sidecar-token: ${KAIRO_ATTACH_SIDECAR_TOKEN:}
      command-max-attempts: ${KAIRO_ATTACH_COMMAND_MAX_ATTEMPTS:3}
    runtime-cleanup:
      retention-ms: ${KAIRO_RUNTIME_CLEANUP_RETENTION_MS:1800000}
      initial-delay-ms: ${KAIRO_RUNTIME_CLEANUP_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${KAIRO_RUNTIME_CLEANUP_FIXED_DELAY_MS:60000}
    auth:
      mode: ${KAIRO_AUTH_MODE:local-token}
      bootstrap-token: ${KAIRO_BOOTSTRAP_TOKEN:}
      bootstrap-actor: ${KAIRO_BOOTSTRAP_ACTOR:system}
      bootstrap-ttl-days: ${KAIRO_BOOTSTRAP_TTL_DAYS:365}
