openapi: 3.0.3
info:
  title: Kairo Platform API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /control/health:
    get:
      summary: Platform health
      responses:
        "200":
          description: OK
  /control/schedulers/run-once:
    post:
      summary: Run platform schedulers once
      responses:
        "200":
          description: Scheduler result
  /auth/me:
    get:
      summary: Current authenticated subject
      responses:
        "200":
          description: Session
  /auth/tokens:
    get:
      summary: List opaque tokens
      responses:
        "200":
          description: Tokens
    post:
      summary: Issue opaque token
      responses:
        "201":
          description: Created
  /auth/tokens/{id}:
    delete:
      summary: Revoke opaque token
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Revoked
  /query/{resource}:
    get:
      summary: Query resource page
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 25
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page
  /details/{resource}/{id}:
    get:
      summary: Resource detail
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Detail
  /targets/search:
    get:
      summary: Search loaded Java targets
      responses:
        "200":
          description: Targets
  /scripts/validate:
    post:
      summary: Validate Groovy script
      responses:
        "200":
          description: Diagnostics
  /scripts/test:
    post:
      summary: Run Groovy script in sandbox
      responses:
        "200":
          description: Test result
  /fencing-tokens:
    get:
      summary: List fencing tokens
      responses:
        "200":
          description: Tokens
    post:
      summary: Issue fencing token
      responses:
        "201":
          description: Issued token
  /instances:
    get:
      summary: List instances
      responses:
        "200":
          description: Instances
    post:
      summary: Create instance
      responses:
        "201":
          description: Created
  /agent-registrations/self:
    post:
      summary: Agent self registration
      responses:
        "201":
          description: Registered
  /attach-sidecars/self:
    post:
      summary: Attach sidecar self registration
      responses:
        "201":
          description: Registered
  /instances/{id}/environment:
    post:
      summary: Assign instance environment
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Assigned
  /instances/{id}/nickname:
    patch:
      summary: Update instance nickname
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated
  /instances/{id}/agent/{action}:
    post:
      summary: Attach, deactivate, or reload an Agent
      parameters:
        - $ref: "#/components/parameters/id"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [attach, deactivate, reload]
      responses:
        "200":
          description: Operation result
  /agents:
    get:
      summary: List agents
      responses:
        "200":
          description: Agents
    post:
      summary: Create agent
      responses:
        "201":
          description: Created
  /agents/{id}/heartbeat:
    post:
      summary: Agent heartbeat
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated
  /agents/{id}/commands/next:
    post:
      summary: Poll next Agent command
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Command
  /agent-commands/{id}/ack:
    post:
      summary: Acknowledge Agent command
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Acknowledged
  /rules:
    get:
      summary: List rules
      responses:
        "200":
          description: Rules
    post:
      summary: Create rule
      responses:
        "201":
          description: Created
  /rules/{id}/detail:
    get:
      summary: Rule ledger detail
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Rule detail
  /rules/{id}/disable:
    post:
      summary: Disable all enabled rule versions
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Disabled
  /rules/{id}/enable:
    post:
      summary: Enable retained rule
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Enabled
  /rules/{id}/versions:
    post:
      summary: Create rule version
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201":
          description: Created
  /rules/{id}/versions/{version}/disable:
    post:
      summary: Disable rule version and unload affected executions
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: Disabled
  /rules/{id}/versions/{version}/enable:
    post:
      summary: Enable retained rule version
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: Enabled
  /operation-plans:
    get:
      summary: List operation plans
      responses:
        "200":
          description: Plans
    post:
      summary: Create operation plan
      responses:
        "201":
          description: Created
  /operation-plans/{id}/transition:
    post:
      summary: Transition operation plan
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated
  /operation-plans/{id}/unload:
    post:
      summary: Unload operation plan
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Unload started
  /rollout-executions:
    get:
      summary: List rollout executions
      responses:
        "200":
          description: Executions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: integer
