name: Build immutable V1.7 soak image

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character V1.7 candidate commit to package
        required: true
        type: string

permissions:
  contents: read

env:
  SOAK_IMAGE: ghcr.io/yongshuaiji/kairo-soak-runner

jobs:
  publish:
    name: Verify and publish linux/amd64 soak runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1

      - name: Validate immutable V1.7 candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD^{commit})" = "$CANDIDATE_SHA"
          git fetch --no-tags --depth=1 origin V1.7:refs/remotes/origin/V1.7
          test "$(git rev-parse origin/V1.7^{commit})" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable soak image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/docker/soak.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SOAK_IMAGE }}:sha-${{ inputs.candidate_sha }}
          build-args: |
            BUILD_SHA=${{ inputs.candidate_sha }}
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            org.opencontainers.image.version=1.7.0
          cache-from: type=gha,scope=kairo-soak-runner-amd64
          cache-to: type=gha,mode=max,scope=kairo-soak-runner-amd64
          provenance: mode=max
          sbom: true

      - name: Record immutable image identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### Kairo V1.7 soak runner"
            echo
            echo "Candidate: \`$CANDIDATE_SHA\`"
            echo "Image: \`${SOAK_IMAGE}@${IMAGE_DIGEST}\`"
            echo "Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
