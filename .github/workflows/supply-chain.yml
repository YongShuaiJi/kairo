name: supply-chain

# V1.7 M5-C (roadmap §12.3 / lts-policy §9): the single, narrowly-scoped supply-chain gate.
#
# Assembles an RC release (build-release.sh), generates the Maven-reactor + Platform-Web CycloneDX
# SBOMs, runs the single Grype 0.116.1 vulnerability scan, applies the third-party license policy,
# promotes the manifest to M5-C, and runs the OFFLINE verifier. Actions and tool versions are pinned
# (no floating latest); Grype 0.116.1 is downloaded as a release binary and its official checksum is
# verified. Only dependency/scanner data is cached -- never credentials or release evidence.
#
# This gate is honest: a Critical/High finding without an exact unexpired exception, or a denied/
# unknown/missing third-party license without an exact unexpired exception, fails the workflow.
# Signature (cosign keyless) and provenance are NOT produced here -- they are owned by M5-D/M6 and
# remain SKIPPED/NOT_AVAILABLE.

on:
  push:
    branches: [main, V1.7, "V1.x"]
  pull_request:
    branches: [main, V1.7]
  workflow_dispatch:

jobs:
  supply-chain:
    name: Supply-chain gate (assemble + SBOM + Grype 0.116.1 + verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRYPE_VERSION: "0.116.1"
      RC_VERSION: "1.7.0-rc.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kairo-platform-web/package-lock.json

      - name: Install pinned Grype 0.116.1 (release binary + official checksum)
        run: |
          set -euo pipefail
          GRYPE_TAR="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -fsSL -o "$GRYPE_TAR" "${base}/${GRYPE_TAR}"
          # Official checksums file for the pinned release (TLS-served from the official GitHub release).
          curl -fsSL -o checksums.txt "${base}/grype_${GRYPE_VERSION}_checksums.txt"
          # Verify the tarball sha256 against the official checksums file.
          expected="$(grep -E " ${GRYPE_TAR}\$" checksums.txt | awk '{print $1}' | head -1)"
          [ -n "$expected" ] || { echo "checksum for $GRYPE_TAR not found in official checksums.txt" >&2; exit 1; }
          actual="$(sha256sum "$GRYPE_TAR" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "grype checksum mismatch: expected=$expected actual=$actual" >&2; exit 1; }
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$GRYPE_TAR" -C "$HOME/.local/bin" grype
          "$HOME/.local/bin/grype" version
          echo "GRYPE_BIN=$HOME/.local/bin/grype" >> "$GITHUB_ENV"

      - name: Cache Grype vulnerability DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/grype/db
          key: grype-db-${{ env.GRYPE_VERSION }}-${{ runner.os }}

      - name: Assemble RC release (eight §12.2 artifacts)
        run: |
          ./scripts/v1.7/build-release.sh \
            --version "$RC_VERSION" --output target/v1.7/rc

      - name: Run the supply-chain gate (SBOM + Grype + license + promote)
        run: |
          ./scripts/v1.7/run-supply-chain.sh --release-dir target/v1.7/rc

      - name: Offline-verify the supply-chain evidence
        run: |
          ./scripts/v1.7/verify-supply-chain.sh --manifest target/v1.7/rc/release-manifest.json

      - name: Upload supply-chain evidence (manifest + SBOMs + reports + config)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            target/v1.7/rc/release-manifest.json
            target/v1.7/rc/SHA256SUMS
            target/v1.7/rc/sbom/
            target/v1.7/rc/reports/
            target/v1.7/rc/supply-chain-config/
          if-no-files-found: error
