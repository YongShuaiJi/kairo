name: compatibility-matrix

# V1.7 §10 / M3-F: the single authoritative real compatibility matrix.
#
# Runs the frozen C01-C10 row interface (scripts/v1.7/run-compatibility.sh) per row on
# the catalog platform, uploads every row-evidence JSON, aggregates them into the one
# compatibility-result.json, generates docs/compatibility/v1.7.md from exactly that
# aggregate, and verifies the aggregate, the generated document and
# v1.7-acceptance-manifest.json conclusions cannot diverge.
#
# No continue-on-error on formal rows (C01-C08, C10): a FAILED/SKIPPED/NOT_RUN formal
# row fails the matrix fail-closed. C09 runs on real macOS arm64/JDK21 and may be PASSED
# or EXPERIMENTAL (both exit 0, non-blocking); it still emits a row JSON with an explicit
# reason when experimental. V17-COMPAT gates advance PR -> RC -> RELEASE only when
# the aggregate passes and the promoted gate carries complete candidate evidence.

on:
  push:
    branches: [main, V1.7, "V1.x"]
  pull_request:
    branches: [main, V1.7]
  schedule:
    # Nightly full matrix at 03:17 UTC (off the :00 mark).
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # M0 migration/provenance freeze tests verify every historical V1.X source
          # commit; a shallow checkout makes them non-reproducible.
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven reactor (build + unit + integration tests)
        run: mvn -B -ntp test

  frontend:
    name: Platform Web (lint + typecheck + test + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kairo-platform-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kairo-platform-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  row:
    name: Row ${{ matrix.scenario }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # C01/C02: plain Java on JDK 17 (premain / external attach).
          - scenario: C01
            runner: ubuntu-24.04
            needs_jdk17: true
          - scenario: C02
            runner: ubuntu-24.04
            needs_jdk17: true
          # C03/C04: Spring Boot 3 executable jar on JDK 21.
          - scenario: C03
            runner: ubuntu-24.04
          - scenario: C04
            runner: ubuntu-24.04
          # C05/C06/C07: ClassLoader / proxy / lambda-bridge on JDK 21 (C07 also JDK 17).
          - scenario: C05
            runner: ubuntu-24.04
          - scenario: C06
            runner: ubuntu-24.04
          - scenario: C07
            runner: ubuntu-24.04
            needs_jdk17: true
          # C08: redefine/retransform/hot-update drift on JDK 21.
          - scenario: C08
            runner: ubuntu-24.04
          # C09: macOS arm64/JDK21 plain-Java agentmain (may be PASSED or EXPERIMENTAL).
          - scenario: C09
            runner: macos-14
          # C10: controlled Byte Buddy Agent coexistence on JDK 21.
          - scenario: C10
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      # JDK 17 is installed first (target JVM) so JDK 21 remains the build JAVA_HOME.
      - name: Set up JDK 17 (target)
        if: matrix.needs_jdk17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Capture JDK 17 home
        if: matrix.needs_jdk17
        # setup-java sets JAVA_HOME to the JDK 17 just installed; capture it before the
        # JDK 21 step overrides JAVA_HOME.
        run: echo "JDK17_HOME_CAPTURED=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK 21 (build)
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Export target JDK homes
        run: |
          # Build JDK is 21 (JAVA_HOME, set last). Target JDK 21 = JAVA_HOME.
          echo "KAIRO_JDK21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          if [ -n "$JDK17_HOME_CAPTURED" ]; then
            # Target JDK 17 captured above (no download, no fragile tool-cache search).
            if [ ! -x "$JDK17_HOME_CAPTURED/bin/java" ]; then
              echo "error: captured JDK 17 home is not a valid JDK: $JDK17_HOME_CAPTURED" >&2
              exit 1
            fi
            echo "KAIRO_JDK17_HOME=$JDK17_HOME_CAPTURED" >> "$GITHUB_ENV"
          fi
      - name: Run compatibility row ${{ matrix.scenario }}
        run: |
          ./scripts/v1.7/run-compatibility.sh \
            --scenario ${{ matrix.scenario }} \
            --output rows/${{ matrix.scenario }}.json
      - name: Upload row evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-row-${{ matrix.scenario }}
          path: rows/${{ matrix.scenario }}.json
          if-no-files-found: error

  aggregate:
    name: Aggregate + document + verify
    needs: row
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download all row evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compat-row-*
          path: rows
          merge-multiple: true
      - name: Aggregate rows into compatibility-result.json
        run: |
          mkdir -p target/v1.7
          ./scripts/v1.7/aggregate-compatibility.sh \
            --input rows \
            --output target/v1.7/compatibility-result.json
      - name: Generate compatibility document
        if: always()
        run: |
          if [ ! -f target/v1.7/compatibility-result.json ]; then
            echo "no aggregate result; skipping document generation"
            exit 0
          fi
          mkdir -p docs/compatibility
          ./scripts/v1.7/generate-compatibility-doc.sh \
            --input target/v1.7/compatibility-result.json \
            --output docs/compatibility/v1.7.md
      - name: Verify aggregate, document and manifest conclusions agree
        if: always()
        run: |
          if [ ! -f target/v1.7/compatibility-result.json ] || [ ! -f docs/compatibility/v1.7.md ]; then
            echo "no aggregate result or document to verify"
            exit 0
          fi
          ./scripts/v1.7/verify-compatibility.sh \
            target/v1.7/compatibility-result.json \
            --doc docs/compatibility/v1.7.md \
            --manifest v1.7-acceptance-manifest.json
      - name: Upload aggregate + document
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-result
          path: |
            target/v1.7/compatibility-result.json
            docs/compatibility/v1.7.md
          if-no-files-found: ignore
