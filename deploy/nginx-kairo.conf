limit_req_zone $binary_remote_addr zone=kairo_web_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=kairo_web_conn_per_ip:10m;

server {
    listen 18380 ssl;
    listen [::]:18380 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xmind-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmind-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:kairo_ssl:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=kairo_web_per_ip burst=100 nodelay;
        limit_conn kairo_web_conn_per_ip 30;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:18381;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 18380;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
