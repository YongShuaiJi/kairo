spring:
  datasource:
    url: jdbc:h2:mem:runtime_mock_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: 127.0.0.1:9092

runtime-mock:
  platform:
    kafka:
      enabled: false
    rollout:
      scheduler:
        enabled: false
    extraction:
      worker:
        enabled: false
    replay:
      worker:
        enabled: false
