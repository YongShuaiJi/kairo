server:
  port: 18280

spring:
  application:
    name: runtime-mock-platform-server
  datasource:
    url: ${RUNTIME_MOCK_DB_URL:jdbc:postgresql://127.0.0.1:5432/runtime_mock}
    username: ${RUNTIME_MOCK_DB_USER:runtime_mock}
    password: ${RUNTIME_MOCK_DB_PASSWORD:runtime_mock}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${RUNTIME_MOCK_REDIS_HOST:127.0.0.1}
      port: ${RUNTIME_MOCK_REDIS_PORT:6379}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

runtime-mock:
  platform:
    api:
      enabled: ${RUNTIME_MOCK_API_ENABLED:true}
    fencing:
      redis-enabled: ${RUNTIME_MOCK_FENCING_REDIS_ENABLED:false}
      key-prefix: ${RUNTIME_MOCK_FENCING_KEY_PREFIX:runtime-mock:fencing:}
      default-ttl-seconds: ${RUNTIME_MOCK_FENCING_DEFAULT_TTL_SECONDS:300}
    rollout:
      scheduler:
        enabled: ${RUNTIME_MOCK_ROLLOUT_SCHEDULER_ENABLED:true}
        fixed-delay-ms: ${RUNTIME_MOCK_ROLLOUT_SCHEDULER_FIXED_DELAY_MS:3000}
        command-lease-seconds: ${RUNTIME_MOCK_AGENT_COMMAND_LEASE_SECONDS:60}
    attach:
      agent-jar: ${RUNTIME_MOCK_ATTACH_AGENT_JAR:/app/runtime-mock-agent-bootstrap.jar}
      core-jar: ${RUNTIME_MOCK_ATTACH_CORE_JAR:/app/runtime-mock-agent-core-modern.jar}
      bootstrap-jar: ${RUNTIME_MOCK_ATTACH_BOOTSTRAP_JAR:/app/runtime-mock-bootstrap-api.jar}
      agent-host: ${RUNTIME_MOCK_ATTACH_AGENT_HOST:127.0.0.1}
      agent-port: ${RUNTIME_MOCK_ATTACH_AGENT_PORT:0}
      platform-url: ${RUNTIME_MOCK_ATTACH_PLATFORM_URL:http://127.0.0.1:18280}
      platform-token: ${RUNTIME_MOCK_ATTACH_PLATFORM_TOKEN:}
      sidecar-token: ${RUNTIME_MOCK_ATTACH_SIDECAR_TOKEN:}
      command-max-attempts: ${RUNTIME_MOCK_ATTACH_COMMAND_MAX_ATTEMPTS:3}
    runtime-cleanup:
      retention-ms: ${RUNTIME_MOCK_RUNTIME_CLEANUP_RETENTION_MS:1800000}
      initial-delay-ms: ${RUNTIME_MOCK_RUNTIME_CLEANUP_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${RUNTIME_MOCK_RUNTIME_CLEANUP_FIXED_DELAY_MS:60000}
    auth:
      mode: ${RUNTIME_MOCK_AUTH_MODE:local-token}
      bootstrap-token: ${RUNTIME_MOCK_BOOTSTRAP_TOKEN:}
      bootstrap-actor: ${RUNTIME_MOCK_BOOTSTRAP_ACTOR:system}
      bootstrap-ttl-days: ${RUNTIME_MOCK_BOOTSTRAP_TTL_DAYS:365}
