services:
  postgres:
    image: postgres:16-alpine
    container_name: runtime-mock-postgres
    environment:
      POSTGRES_DB: runtime_mock
      POSTGRES_USER: runtime_mock
      POSTGRES_PASSWORD: runtime_mock
    ports:
      - "5432:5432"
    volumes:
      - runtime-mock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime_mock -d runtime_mock"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: runtime-mock-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:9092
    ports:
      - "9092:19092"
      - "9644:9644"
    volumes:
      - runtime-mock-kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: runtime-mock-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - runtime-mock-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: runtime-mock-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: runtime_mock
      MINIO_ROOT_PASSWORD: runtime_mock_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - runtime-mock-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  platform:
    image: runtime-mock-platform-server:0.1.0-SNAPSHOT
    build:
      context: ./runtime-mock-platform-server
      dockerfile: Dockerfile
    container_name: runtime-mock-platform
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      RUNTIME_MOCK_DB_URL: jdbc:postgresql://postgres:5432/runtime_mock
      RUNTIME_MOCK_DB_USER: runtime_mock
      RUNTIME_MOCK_DB_PASSWORD: runtime_mock
      RUNTIME_MOCK_REDIS_HOST: redis
      RUNTIME_MOCK_REDIS_PORT: "6379"
      RUNTIME_MOCK_FENCING_REDIS_ENABLED: "true"
      RUNTIME_MOCK_API_ENABLED: "true"
      RUNTIME_MOCK_WORKER_ENABLED: "false"
      RUNTIME_MOCK_KAFKA_ENABLED: "false"
      RUNTIME_MOCK_ROLLOUT_SCHEDULER_ENABLED: "false"
      RUNTIME_MOCK_EXTRACTION_WORKER_ENABLED: "false"
      RUNTIME_MOCK_REPLAY_WORKER_ENABLED: "false"
      RUNTIME_MOCK_RECORDING_INGESTION_ENABLED: "true"
      RUNTIME_MOCK_OBJECT_STORAGE_PROVIDER: minio
      RUNTIME_MOCK_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      RUNTIME_MOCK_OBJECT_STORAGE_ACCESS_KEY: runtime_mock
      RUNTIME_MOCK_OBJECT_STORAGE_SECRET_KEY: runtime_mock_secret
      RUNTIME_MOCK_OBJECT_STORAGE_BUCKET: runtime-mock
      RUNTIME_MOCK_MASTER_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUNTIME_MOCK_MASTER_KEY_VERSION: compose-dev-v1
      RUNTIME_MOCK_AUTH_MODE: local-token
      RUNTIME_MOCK_BOOTSTRAP_TOKEN: runtime-mock-dev-admin-token-change-me
    ports:
      - "18280:18280"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18280; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    image: runtime-mock-platform-server:0.1.0-SNAPSHOT
    container_name: runtime-mock-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: "18281"
      RUNTIME_MOCK_DB_URL: jdbc:postgresql://postgres:5432/runtime_mock
      RUNTIME_MOCK_DB_USER: runtime_mock
      RUNTIME_MOCK_DB_PASSWORD: runtime_mock
      RUNTIME_MOCK_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RUNTIME_MOCK_KAFKA_ENABLED: "true"
      RUNTIME_MOCK_OUTBOX_FIXED_DELAY_MS: "1000"
      RUNTIME_MOCK_REDIS_HOST: redis
      RUNTIME_MOCK_REDIS_PORT: "6379"
      RUNTIME_MOCK_FENCING_REDIS_ENABLED: "true"
      RUNTIME_MOCK_API_ENABLED: "false"
      RUNTIME_MOCK_WORKER_ENABLED: "true"
      RUNTIME_MOCK_ROLLOUT_SCHEDULER_ENABLED: "true"
      RUNTIME_MOCK_EXTRACTION_WORKER_ENABLED: "true"
      RUNTIME_MOCK_REPLAY_WORKER_ENABLED: "true"
      RUNTIME_MOCK_OBJECT_STORAGE_PROVIDER: minio
      RUNTIME_MOCK_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      RUNTIME_MOCK_OBJECT_STORAGE_ACCESS_KEY: runtime_mock
      RUNTIME_MOCK_OBJECT_STORAGE_SECRET_KEY: runtime_mock_secret
      RUNTIME_MOCK_OBJECT_STORAGE_BUCKET: runtime-mock
      RUNTIME_MOCK_MASTER_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUNTIME_MOCK_MASTER_KEY_VERSION: compose-dev-v1
    ports:
      - "18281:18281"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18281; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 30

  platform-web:
    image: runtime-mock-platform-web:0.1.0
    build:
      context: ./runtime-mock-platform-web
      dockerfile: Dockerfile
    container_name: runtime-mock-platform-web
    depends_on:
      platform:
        condition: service_healthy
    environment:
      RUNTIME_MOCK_PLATFORM_API_URL: http://platform:18280
      RUNTIME_MOCK_WEB_SESSION_KEY: runtime-mock-compose-session-key-change-me
      RUNTIME_MOCK_WEB_DEMO_MODE: "false"
    ports:
      - "18380:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  demo-app:
    image: runtime-mock-demo:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: runtime-mock-demo/Dockerfile
    container_name: runtime-mock-demo
    depends_on:
      platform:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/app/runtime-mock-agent-bootstrap.jar=coreJar=/app/runtime-mock-agent-core-modern.jar,bootstrapJar=/app/runtime-mock-bootstrap-api.jar,host=127.0.0.1,port=18080,token=dev,platformUrl=http://platform:18280,platformToken=runtime-mock-dev-admin-token-change-me,platformProjectName=runtime-mock,platformApplicationName=runtime-mock-demo
    ports:
      - "18082:18080"
      - "18092:18090"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18090; printf 'GET /demo/stats HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  runtime-mock-postgres-data:
  runtime-mock-kafka-data:
  runtime-mock-redis-data:
  runtime-mock-minio-data:
