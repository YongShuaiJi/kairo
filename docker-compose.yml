services:
  postgres:
    image: postgres:16-alpine
    container_name: kairo-postgres
    environment:
      POSTGRES_DB: kairo
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
    ports:
      - "5432:5432"
    volumes:
      - kairo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kairo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - kairo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform:
    image: kairo-platform-server:1.7.0
    build:
      context: .
      dockerfile: kairo-platform-server/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.7.0-SNAPSHOT}
    container_name: kairo-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAIRO_DB_URL: jdbc:postgresql://postgres:5432/kairo
      KAIRO_DB_USER: kairo
      KAIRO_DB_PASSWORD: kairo
      KAIRO_REDIS_HOST: redis
      KAIRO_REDIS_PORT: "6379"
      KAIRO_FENCING_REDIS_ENABLED: "true"
      KAIRO_API_ENABLED: "true"
      KAIRO_ROLLOUT_SCHEDULER_ENABLED: "true"
      KAIRO_AUTH_MODE: local-token
      KAIRO_BOOTSTRAP_TOKEN: kairo-dev-admin-token-change-me
      KAIRO_ATTACH_PLATFORM_URL: http://platform:18280
      KAIRO_ATTACH_PLATFORM_TOKEN: kairo-dev-admin-token-change-me
    ports:
      - "18280:18280"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18280; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 30

  platform-web:
    image: kairo-platform-web:1.7.0
    build:
      context: ./kairo-platform-web
      dockerfile: Dockerfile
    container_name: kairo-platform-web
    depends_on:
      platform:
        condition: service_healthy
    environment:
      KAIRO_PLATFORM_API_URL: http://platform:18280
      KAIRO_WEB_SESSION_KEY: kairo-compose-session-key-change-me
      KAIRO_WEB_DEMO_MODE: "false"
    ports:
      - "18380:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  demo-app:
    image: kairo-demo:1.7.0
    build:
      context: .
      dockerfile: kairo-demo/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.7.0-SNAPSHOT}
    container_name: kairo-demo
    depends_on:
      platform:
        condition: service_healthy
    volumes:
      - kairo-demo-tmp:/tmp
    ports:
      - "18082:18080"
      - "18092:18090"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18090; printf 'GET /demo/stats HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kairo-postgres-data:
  kairo-redis-data:
  kairo-demo-tmp:
