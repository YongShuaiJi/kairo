services:
  attach-executor:
    image: kairo-attach-executor:1.7.0
    build:
      context: .
      dockerfile: kairo-attach-cli/Dockerfile
    container_name: kairo-attach-executor
    pid: "service:demo-app"
    depends_on:
      platform:
        condition: service_healthy
      demo-app:
        condition: service_healthy
    environment:
      KAIRO_EXECUTOR_ID: kairo-attach-executor
      KAIRO_EXECUTOR_TYPE: SIDECAR_CONTAINER
      KAIRO_PLATFORM_URL: http://platform:18280
      KAIRO_PLATFORM_TOKEN: kairo-dev-admin-token-change-me
      KAIRO_SIDECAR_ENDPOINT: http://attach-executor:18480
      KAIRO_AGENT_JAR: /app/kairo-agent-bootstrap.jar
      KAIRO_TARGETS_JSON: >-
        [{"projectName":"kairo","applicationName":"kairo-demo","environmentName":"sit","nickname":"kairo-demo","hostname":"demo-app","processId":"1","processStartId":"kairo-demo:demo-app:1","runtime":"java","javaVersion":"21.0.11","agentJar":"/app/kairo-agent-bootstrap.jar"}]
    volumes:
      - kairo-demo-tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/18480; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30
