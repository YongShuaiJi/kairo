#
# Build-time version of the Vineflower decompiler, filtered from the
# vineflower.version Maven property. Read by VineflowerBytecodeDecompiler so the
# version survives shading into kairo-agent-core-modern (where Vineflower's own jar
# manifest, normally the source of ConsoleDecompiler.version(), is merged away).
# Only the value below is filtered; keep any literal placeholders out of comments.
#
vineflower.version=${vineflower.version}
