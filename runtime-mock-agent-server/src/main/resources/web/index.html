<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runtime Mock Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Runtime Mock Console</h1>
      <span id="connectionState" class="state">Disconnected</span>
    </div>
    <form id="connectionForm" class="connection">
      <label>Token <input id="agentToken" type="password" autocomplete="off"></label>
      <button type="submit">Connect</button>
    </form>
  </header>

  <main class="layout">
    <section class="band metrics">
      <div><span>PID</span><strong id="pid">-</strong></div>
      <div><span>JDK</span><strong id="jdk">-</strong></div>
      <div><span>Enhanced</span><strong id="enhanced">-</strong></div>
      <div><span>Rules</span><strong id="activeRules">-</strong></div>
      <div><span>Hits</span><strong id="hits">-</strong></div>
      <div><span>Errors</span><strong id="errors">-</strong></div>
      <button id="disableAll" type="button">Disable All</button>
      <button id="resetAll" type="button" class="danger">Reset All</button>
    </section>

    <section class="workspace">
      <aside class="panel browser">
        <div class="panelHead">
          <h2>Classes</h2>
          <button id="refreshJvm" type="button">Refresh</button>
        </div>
        <form id="classSearch" class="search">
          <input id="classKeyword" placeholder="OrderService">
          <button type="submit">Search</button>
        </form>
        <div id="classResults" class="list"></div>
        <h2>Methods</h2>
        <div id="methodResults" class="list compact"></div>
      </aside>

      <section class="panel editor">
        <div class="panelHead">
          <h2>Rule Editor</h2>
          <div class="segmented">
            <button type="button" data-phase="BEFORE" class="active">BEFORE</button>
            <button type="button" data-phase="RETURN">RETURN</button>
            <button type="button" data-phase="THROWS">THROWS</button>
          </div>
        </div>
        <form id="ruleForm" class="ruleGrid">
          <input id="ruleId" placeholder="rule-id">
          <input id="ruleName" placeholder="name">
          <input id="className" placeholder="className" readonly>
          <input id="classLoaderId" placeholder="classLoaderId" readonly>
          <input id="methodName" placeholder="methodName" readonly>
          <input id="methodDescriptor" placeholder="methodDescriptor" readonly>
          <input id="priority" type="number" value="100" title="priority">
          <input id="percentage" type="number" min="0" max="100" value="100" title="percentage">
          <input id="maxHits" type="number" min="0" value="0" title="maxHits">
          <input id="expireAt" type="number" min="0" value="0" title="expireAt">
          <label class="check"><input id="failOpen" type="checkbox" checked> fail-open</label>
          <label class="check"><input id="enabled" type="checkbox" checked> enabled</label>
        </form>
        <div class="toolbar">
          <button type="button" data-template="fixedReturn">Return JSON</button>
          <button type="button" data-template="throwException">Throw</button>
          <button type="button" data-template="setArg">Set Arg</button>
          <button type="button" data-template="setResult">Set Result</button>
          <button type="button" data-template="throwsReturn">Fallback</button>
          <button id="formatScript" type="button">Format</button>
          <button id="compileScript" type="button">Compile</button>
          <button id="saveRule" type="button">Publish</button>
        </div>
        <textarea id="script" spellcheck="false">return mock.proceed()</textarea>
        <div class="editorMeta">
          <div>
            <strong>Variables</strong>
            <span>args</span><span>target</span><span>result</span><span>throwable</span><span>method</span><span>ctx</span><span>mock</span><span>log</span>
          </div>
          <pre id="compileResult"></pre>
        </div>
      </section>

      <aside class="panel rules">
        <div class="panelHead">
          <h2>Rules</h2>
          <button id="refreshRules" type="button">Refresh</button>
        </div>
        <div id="ruleList" class="list"></div>
        <h2>Events</h2>
        <div id="eventList" class="events"></div>
      </aside>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
